<!DOCTYPE html>
<html>
  <head>
    <title>My Notes App</title>
  </head>
  <body>
    <h1>My notes</h1>

    <ul id="notes">
      <li>loading...</li>
    </ul>

    <script>
      fetch("/api/notes")
        .then((res) => {
          if (!res.ok) {
            throw new Error(`HTTP error: ${res.status}`);
          }

          return res.json();
        })
        .then((notes) => {
          const list = document.getElementById("notes");

          list.innerHTML = "";

          notes.forEach((note) => {
            const item = document.createElement("li");
            item.textContent = note.text;
            list.appendChild(item);
          });
        })
        .catch((error) => {
          console.error(error);
          document.getElementById("notes").innerHTML =
            "<li>Failed to load notes.</li>";
        });
    </script>
  </body>
</html>
